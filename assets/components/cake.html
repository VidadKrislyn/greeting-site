<svg
    id="birthday-cake-svg"
    viewBox="0 0 500 700"
    xmlns="http://www.w3.org/2000/svg"
>

    <defs>

        <!-- =========================
             GRADIENTS
        ========================== -->

        <linearGradient id="pinkCake" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="#ff9ad5"/>
            <stop offset="100%" stop-color="#ff5fb2"/>
        </linearGradient>

        <linearGradient id="creamDrip" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="#fff4ea"/>
            <stop offset="100%" stop-color="#ffe2cb"/>
        </linearGradient>

        <radialGradient id="flameOuter">
            <stop offset="0%" stop-color="#fff6b0"/>
            <stop offset="60%" stop-color="#ffb300"/>
            <stop offset="100%" stop-color="#ff6a00"/>
        </radialGradient>

        <radialGradient id="flameInner">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#ffe066"/>
        </radialGradient>

        <!-- SHADOW -->
        <filter id="shadow">
            <feDropShadow
                dx="0"
                dy="8"
                stdDeviation="8"
                flood-opacity="0.25"
            />
        </filter>

        <!-- FLAME GLOW -->
        <filter id="flameGlow">
            <feGaussianBlur stdDeviation="5" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- CANDLE STRIPES -->
        <pattern
            id="candleStripe"
            width="12"
            height="12"
            patternUnits="userSpaceOnUse"
            patternTransform="rotate(45)"
        >
            <rect width="12" height="12" fill="#3fd8c2"/>
            <rect width="6" height="12" fill="#ffffff"/>
        </pattern>

    </defs>

    <!-- =========================
         BOTTOM LAYER
    ========================== -->

    <g class="cake-part layer-bottom">

        <!-- top -->
        <ellipse
            cx="250"
            cy="470"
            rx="170"
            ry="35"
            fill="#ffb3dd"
        />

        <!-- body -->
        <rect
            x="80"
            y="470"
            width="340"
            height="120"
            rx="25"
            fill="url(#pinkCake)"
            filter="url(#shadow)"
        />

        <ellipse
            cx="250"
            cy="485"
            rx="130"
            ry="10"
            fill="#ffffff22"
        />

        <!-- frosting -->
        <g class="frosting-animation frosting-bottom-wrap">

            <!-- FALLING ICING -->

            <path
                class="frosting-blob frosting-blob-bottom"
                fill="url(#creamDrip)"
                d="
                M250 330
                C320 340 330 420 250 510
                C170 420 180 340 250 330
                Z
                "
            />

            <!-- FINAL FROSTING -->

            <path
                class="frosting-final frosting-bottom"
                fill="url(#creamDrip)"
                d="
                M80 470

                C105 500 125 445 145 485
                C160 520 185 455 205 495

                C225 545 255 445 275 500
                C295 540 320 450 340 490

                C360 525 385 460 420 488

                L420 470
                Z
                "
            />

        </g>

    </g>

    <!-- =========================
         MIDDLE LAYER
    ========================== -->

    <g class="cake-part layer-middle">

        <ellipse
            cx="250"
            cy="340"
            rx="125"
            ry="28"
            fill="#ffb3dd"
        />

        <rect
            x="125"
            y="340"
            width="250"
            height="110"
            rx="25"
            fill="url(#pinkCake)"
            filter="url(#shadow)"
        />

        <ellipse
            cx="250"
            cy="485"
            rx="130"
            ry="10"
            fill="#ffffff22"
        />

        <g class="frosting-animation frosting-middle-wrap">

            <!-- FALLING ICING -->

            <path
                class="frosting-blob frosting-blob-middle"
                fill="url(#creamDrip)"
                d="
                M250 200
                C295 210 305 260 250 330
                C195 260 205 210 250 200
                Z
                "
            />

            <!-- FINAL FROSTING -->

            <path
                class="frosting-final frosting-middle"
                fill="url(#creamDrip)"
                d="
                M125 340

                C145 370 165 325 180 352
                C195 400 225 315 240 360

                C255 420 285 320 305 370
                C320 395 345 330 375 355

                L375 340
                Z
                "
            />

        </g>

    </g>

    <!-- =========================
         TOP LAYER
    ========================== -->

    <g class="cake-part layer-top">

        <ellipse
            cx="250"
            cy="225"
            rx="95"
            ry="24"
            fill="#ffb3dd"
        />

        <rect
            x="155"
            y="225"
            width="190"
            height="95"
            rx="22"
            fill="url(#pinkCake)"
            filter="url(#shadow)"
        />

        <ellipse
            cx="250"
            cy="485"
            rx="130"
            ry="10"
            fill="#ffffff22"
        />

        <g class="frosting-animation frosting-top-wrap">

            <!-- FALLING ICING -->

                fill="url(#creamDrip)"
                d="
                M250 100
                C285 110 295 150 250 220
                C205 150 215 110 250 100

                "
            />

            <!-- FINAL FROSTING -->

            <path

                fill="url(#creamDrip)"
                d="
                M155 225

                C170 250 190 215 205 240
                C220 290 245 205 260 250

                C275 300 300 215 320 255
                C330 275 338 225 345 242

                L345 225
                Z
                "
            />

        </g>

    </g>

    <!-- =========================

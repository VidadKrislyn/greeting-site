<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift</title>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/stars.css">
    <link rel="stylesheet" href="assets/css/gift-scene.css">
    <link rel="stylesheet" href="assets/css/card-scene.css">
    <link rel="stylesheet" href="assets/css/cake-scene.css">
</head>
<body>

    <div class="stars">

        <!-- BIG STARS -->
        <div class="star big s1"></div>
        <div class="star big s2"></div>
        <div class="star big s3"></div>
        <div class="star big s4"></div>
        <div class="star big s5"></div>
        <div class="star big s6"></div>

        <!-- SMALL DOT STARS -->
        <div class="star-dot d1"></div>
        <div class="star-dot d2"></div>
        <div class="star-dot d3"></div>
        <div class="star-dot d4"></div>
        <div class="star-dot d5"></div>
        <div class="star-dot d6"></div>
        <div class="star-dot d7"></div>
        <div class="star-dot d8"></div>
        <div class="star-dot d9"></div>
        <div class="star-dot d10"></div>
        <div class="star-dot d11"></div>
        <div class="star-dot d12"></div>

    </div>

    <nav class="navbar bg-dark navbar-dark sticky-top">
  ...
</nav>
    
    <main id="main-content" >
        <section id="gift-scene" class="scene">
            <h1>Welcome!</h1> 
            <h4>Click the gift to open</h4>
            <img src="assets/Gift.gif" id="gift-box" alt="Gift Box" style="width:128px;height:128px;">
        </section>
        <section id="card-scene" class="scene hidden">
            <div class="card-wrapper">

            <div class="birthday-card" id="birthday-card">

                <!-- MESSAGE PAGE -->
                <div class="message-page">

                    <h2>Happy Birthday 🎉</h2>

                    <p>
                        Wishing you happiness,
                        laughter, and beautiful memories 💖
                    </p>
                    <button id="continue-btn" class="hidden-btn">
                        Click to Continue
                    </button>

                </div>

                <!-- COVER -->
                <div class="card-cover">

                    <!-- FRONT -->
                    <div class="cover-front">

                        <h1>For You 💌</h1>

                    </div>

                    <!-- BACK -->
                    <div class="cover-back">

                        <h2>💖</h2>

                        <p>
                            A small letter for someone special ✨
                        </p>

                    </div>

                </div>

            </div>

        </div>
        </section>
        <section id="cake-scene" class="scene hidden">
            <h1 class="birthday-title">
                Happy Birthday 🎉
            </h1>

            <div class="cake-container">

                <div id="cake-svg-wrapper"></div>

            </div>
        </section>
    </main>
    
    <footer class="text-white text-center py-3">
        <div class="container">
            <span>Created by: KC</span>
        </div>
    </footer>

    <audio id="birthday-song-1" src="assets/Song1.mp3"></audio>
    <audio id="clap-sound" src="assets/Clapping.mp3"></audio>
    <audio id="birthday-song-2" src="assets/Song2.mp3"></audio>

    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/confetti.browser.min.js"></script>
    <script src="assets/js/script.js"></script>
    <script src="assets/js/card-scene.js"></script>
    <script src="assets/js/cake-scene.js"></script>
    <script src="assets/js/mic-blow.js"></script>
    <script src="assets/js/scene-transition.js"></script>
</body>
</html>

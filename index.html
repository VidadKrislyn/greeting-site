<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar bg-dark navbar-dark sticky-top">
  ...
</nav>
    
    <main id="main-content" >
        <section id="gift-scene" class="scene">
            <h1>Welcome!</h1> 
            <h4>Click the gift to open</h4>
            <img src="assets/Gift.gif" id="gift-box" alt="Gift Box" style="width:128px;height:128px;">
        </section>
        <section id="card-scene" class="scene hidden">
            <div class="card-wrapper">

            <div class="birthday-card" id="birthday-card">

                <!-- MESSAGE PAGE -->
                <div class="message-page">

                    <h2>Happy Birthday 🎉</h2>

                    <p>
                        Wishing you happiness,
                        laughter, and beautiful memories 💖
                    </p>
                    <button id="continue-btn" class="hidden-btn">
                        Click to Continue
                    </button>

                </div>

                <!-- COVER -->
                <div class="card-cover">

                    <!-- FRONT -->
                    <div class="cover-front">

                        <h1>For You 💌</h1>

                    </div>

                    <!-- BACK -->
                    <div class="cover-back">

                        <h2>💖</h2>

                        <p>
                            A small letter for someone special ✨
                        </p>

                    </div>

                </div>

            </div>

        </div>
        </section>
        <section id="cake-scene" class="scene hidden">
            <h1 class="birthday-title">
                Happy Birthday 🎉
            </h1>

            <div class="cake-container">

                <!-- CANDLES -->
                <div class="candles">

                    <div class="candle">

                        <div class="flame"></div>

                        <div class="smoke"></div>

                    </div>

                    <div class="candle">

                        <div class="flame"></div>

                        <div class="smoke"></div>

                    </div>

                    <div class="candle">

                        <div class="flame"></div>

                        <div class="smoke"></div>

                    </div>

                </div>

                <!-- CAKE -->
                <div class="cake">

                    <div class="cake-top"></div>

                    <div class="cake-body"></div>

                </div>

                <button id="blow-btn">
                    Blow Candles 🎤
                </button>

            </div>
        </section>
    </main>
    
    <footer class="text-white text-center py-3">
        <div class="container">
            <span>Created by: KC</span>
        </div>
    </footer>

    <audio id="birthday-song-1" src="assets/Song1.mp3"></audio>
    <audio id="clap-sound" src="assets/Clapping.mp3"></audio>
    <audio id="birthday-song-2" src="assets/Song2.mp3"></audio>

    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
